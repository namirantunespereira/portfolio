name: Keep demo services warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping cloud-cargo-api
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w 'cloud-cargo-api: %{http_code}\n' --max-time 60 https://cloud-cargo-api.onrender.com/health

      - name: Ping camunda-quest-orchestrator
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w 'camunda-quest-orchestrator: %{http_code}\n' --max-time 60 https://camunda-quest-orchestrator.onrender.com/actuator/health

      - name: Ping spring-orders-boss
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w 'spring-orders-boss: %{http_code}\n' --max-time 60 https://spring-orders-boss.onrender.com/actuator/health
